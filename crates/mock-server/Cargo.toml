[package]
name = "mock-server"
version = "0.1.0"
edition = "2021"
description = "Mock OpenAI-compatible server for testing Meilisearch vector search and LLM integrations"
license = "MIT"
publish = false

[lib]
name = "mock_server"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography for deterministic embeddings
sha2 = "0.10"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Logging/tracing
tracing = "0.1"

[dev-dependencies]
# HTTP client for tests
reqwest = { version = "0.12", features = ["json"] }
